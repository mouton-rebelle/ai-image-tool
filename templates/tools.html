<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tools</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 40px 24px;
    background: #14161a;
    color: #e6e9ee;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 {
    margin: 0 0 4px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #9aa3b0;
  }
  p.lede { margin: 0 0 22px; color: #646d7a; font-size: 13px; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  a {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 13px 15px;
    background: #1f232a;
    border: 1px solid #2b3038;
    border-radius: 8px;
    color: inherit;
    text-decoration: none;
    transition: background .12s, border-color .12s, transform .12s;
  }
  a:hover { background: #262b33; border-color: #4ea1ff; transform: translateX(2px); }
  .name { font-weight: 600; }
  .slug {
    margin-left: auto;
    font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #646d7a;
  }
  .empty { padding: 13px 15px; border: 1px dashed #2b3038; border-radius: 8px; color: #646d7a; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #9aa3b0; }
  .back { display: inline-block; margin-top: 22px; font-size: 12px; color: #646d7a; }
  .back:hover { color: #4ea1ff; }
</style>
</head>
<body>
<main>
  <h1>Tools</h1>
  <p class="lede">Local utilities served alongside the image viewer.</p>
  <ul>
    {{range .Tools}}
    <li><a href="{{.Path}}"><span class="name">{{.Name}}</span><span class="slug">{{.Slug}}</span></a></li>
    {{else}}
    <li class="empty">Nothing here yet — drop a folder holding an <code>index.html</code> into <code>tools/</code>.</li>
    {{end}}
  </ul>
  <a class="back" href="/">&larr; Image viewer</a>
</main>
</body>
</html>
