<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{.Title}}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>
    <link rel="stylesheet" href="/static/styles.css?v=20260725-delete-image-2">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{.Title}} <span class="image-count" id="image-count">({{.TotalCount}} images)</span></h1>
            <form class="search-form" hx-get="/search" hx-target="#image-results" hx-trigger="submit, change from:select[name='model'], keyup changed delay:500ms from:input[name='q']" hx-swap="innerHTML">
                <div class="search-inputs">
                    <input type="text" class="prompt-input" name="q" placeholder="Search prompts..." value="{{.SearchQuery}}">
                    <select class="model-select" name="model">
                        <option value="all">All Models</option>
                        {{range $model := .Models}}
                            <option value="{{$model.ID}}"{{if and (gt $.SelectedModelID 0) (eq $model.ID $.SelectedModelID)}} selected{{end}}>{{$model.Name}}{{if $model.VersionName}} - {{$model.VersionName}}{{end}} ({{$model.ImageCount}})</option>
                        {{end}}
                        {{if gt .OthersCount 0}}
                            <option value="OTHERS"{{if .OthersSelected}} selected{{end}}>Others ({{.OthersCount}})</option>
                        {{end}}
                    </select>
                </div>
                <input type="hidden" name="nsfw" id="nsfw-filter" value="{{.NSFWFilter}}">
                <input type="hidden" name="page" value="1">
                <div class="search-actions">
                    <button type="submit" class="search-btn">Search</button>
                    <button type="button" class="clear-btn" id="clear-btn" onclick="clearFilters()" title="Clear all filters" disabled>✕</button>
                </div>
            </form>

            <div class="filter-buttons">
                <button type="button" data-nsfw-filter="all" class="filter-btn{{if eq .NSFWFilter "all"}} active{{end}}" onclick="setNSFWFilter('all')">All</button>
                <button type="button" data-nsfw-filter="sfw" class="filter-btn{{if eq .NSFWFilter "sfw"}} active{{end}}" onclick="setNSFWFilter('sfw')">SFW Only</button>
                <button type="button" data-nsfw-filter="nsfw" class="filter-btn{{if eq .NSFWFilter "nsfw"}} active{{end}}" onclick="setNSFWFilter('nsfw')">NSFW Only</button>
            </div>
        </div>

        <div id="image-results" hx-get="{{.InitialURL}}" hx-trigger="load">
            <div class="loading">Loading images...</div>
        </div>

        <div id="load-more" style="display: none;" hx-target="#unified-grid" hx-swap="beforeend"
             hx-trigger="intersect once" hx-indicator=".loading">
            <div class="loading">Loading more images...</div>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <span class="lightbox-prev">&#10094;</span>
        <span class="lightbox-next">&#10095;</span>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="">
            <div class="lightbox-metadata">
                <div class="lightbox-model-info">
                    <h3 id="lightbox-model"></h3>
                    <p class="lightbox-version" id="lightbox-version"></p>
                </div>
                <div class="lightbox-params">
                    <span id="lightbox-steps"></span>
                    <span id="lightbox-cfg"></span>
                    <span id="lightbox-sampler"></span>
                    <span id="lightbox-scheduler"></span>
                    <span id="lightbox-seed" class="clickable-seed" onclick="copySeed()" title="Click to copy seed"></span>
                </div>
                <div class="lightbox-loras-section" id="lightbox-loras-section">
                    <strong>LoRAs:</strong>
                    <div class="loras-container" id="lightbox-loras"></div>
                </div>
                <div class="lightbox-prompts">
                    <div class="lightbox-prompt-section">
                        <strong>Prompt:</strong>
                        <p id="lightbox-prompt" class="clickable-prompt" onclick="copyPositivePrompt()" title="Click to copy positive prompt"></p>
                    </div>
                    <div class="lightbox-prompt-section" id="lightbox-neg-section">
                        <strong>Negative Prompt:</strong>
                        <p id="lightbox-neg-prompt" class="clickable-prompt" onclick="copyNegativePrompt()" title="Click to copy negative prompt"></p>
                    </div>
                </div>
                <div class="lightbox-actions">
                    <div class="prompt-generation-controls">
                        <button id="generate-prompt-btn" class="generate-prompt-btn" type="button" onclick="togglePromptGenerationForm()" aria-expanded="false" aria-controls="prompt-remix-form">
                            <span id="generate-prompt-text">Gen prompt</span>
                            <span class="prompt-loader" aria-hidden="true"></span>
                        </button>
                        <form id="prompt-remix-form" class="prompt-remix-form" onsubmit="submitPromptGeneration(event)" hidden>
                            <div class="prompt-remix-grid">
                                <label class="prompt-remix-field">
                                    <span>Target</span>
                                    <select id="prompt-target-model">
                                        <option value="anima">Anima</option>
                                        <option value="krea-2">Krea 2</option>
                                    </select>
                                </label>
                                <label class="prompt-remix-field">
                                    <span>Concept</span>
                                    <select id="prompt-concept">
                                        <option value="describe">Describe</option>
                                        <option value="remix" selected>Remix</option>
                                        <option value="next">Next</option>
                                        <option value="before">Before</option>
                                    </select>
                                </label>
                            </div>
                            <p id="prompt-concept-hint" class="prompt-concept-hint"></p>
                            <label class="prompt-remix-field prompt-remix-steering">
                                <span>Creative direction <small>optional</small></span>
                                <textarea id="prompt-steering" maxlength="2000" rows="3" placeholder="e.g. Exactly two seconds later, at the instant she hits the water"></textarea>
                            </label>
                            <div class="prompt-remix-actions">
                                <button class="prompt-remix-submit" type="submit">Generate</button>
                                <button class="prompt-remix-cancel" type="button" onclick="closePromptGenerationForm()">Cancel</button>
                            </div>
                        </form>
                        <p id="prompt-generation-status" class="prompt-generation-status" aria-live="polite"></p>
                    </div>
                    <button id="category-toggle-btn" class="category-toggle-btn" onclick="toggleImageCategory()" title="Move to other category">
                        <span id="category-toggle-text">hide</span>
                    </button>
                    <button id="delete-image-btn" class="delete-image-btn" type="button" onclick="deleteCurrentImage()" title="Delete image">
                        <span id="delete-image-text">delete</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
    window.modelStatsRequestVersion = 0;

    window.refreshModelOptions = async function(filter, requestVersion) {
        const modelSelect = document.querySelector('.model-select');
        if (!modelSelect) return;

        const selectedModel = modelSelect.value;

        try {
            const response = await fetch(`/api/models?nsfw=${encodeURIComponent(filter)}`);
            if (!response.ok) {
                throw new Error(`Model statistics request failed with status ${response.status}`);
            }

            const stats = await response.json();
            if (requestVersion !== window.modelStatsRequestVersion) return;

            const allModelsOption = document.createElement('option');
            allModelsOption.value = 'all';
            allModelsOption.textContent = 'All Models';
            modelSelect.replaceChildren(allModelsOption);

            stats.models.forEach(model => {
                const option = document.createElement('option');
                option.value = String(model.id);
                const version = model.version_name ? ` - ${model.version_name}` : '';
                option.textContent = `${model.name}${version} (${model.image_count})`;
                modelSelect.appendChild(option);
            });

            if (stats.others_count > 0) {
                const othersOption = document.createElement('option');
                othersOption.value = 'OTHERS';
                othersOption.textContent = `Others (${stats.others_count})`;
                modelSelect.appendChild(othersOption);
            }

            const selectedModelStillExists = Array.from(modelSelect.options)
                .some(option => option.value === selectedModel);
            modelSelect.value = selectedModelStillExists ? selectedModel : 'all';
            window.currentModel = modelSelect.value;
            updateClearButtonState();
        } catch (error) {
            console.error('Unable to refresh model statistics:', error);
        }
    };

    async function setNSFWFilter(filter) {
        // Update hidden input
        document.getElementById('nsfw-filter').value = filter;

        // Update active button
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        const activeButton = document.querySelector(`[data-nsfw-filter="${filter}"]`);
        if (activeButton) {
            activeButton.classList.add('active');
        }

        // Update current search parameters and reset page
        window.currentNSFWFilter = filter;
        window.currentPage = 1; // Reset to page 1
        const requestVersion = ++window.modelStatsRequestVersion;

        // Refresh model counts and drop a model selection that is unavailable
        // in the newly selected category before loading the image grid.
        await window.refreshModelOptions(filter, requestVersion);
        if (requestVersion !== window.modelStatsRequestVersion) return;

        // Trigger search with new filter
        const promptInput = document.querySelector('.prompt-input');
        const modelSelect = document.querySelector('.model-select');
        const promptValue = promptInput.value;
        const modelValue = modelSelect.value;

        let url;
        const params = new URLSearchParams();
        params.set('page', '1');

        // Always set nsfw parameter to preserve filter state
        params.set('nsfw', filter);

        if (promptValue.trim() !== '') {
            params.set('q', promptValue);
        }

        if (modelValue !== 'all') {
            params.set('model', modelValue);
        }

        if (params.get('q') || params.get('model')) {
            url = `/search?${params.toString()}`;
        } else {
            url = `/api/images?${params.toString()}`;
        }

        // Reset and update the request
        const imageResults = document.getElementById('image-results');
        const loadMore = document.getElementById('load-more');

        // Clear existing content immediately
        imageResults.innerHTML = '<div class="loading">Loading images...</div>';

        // Hide load more temporarily
        if (loadMore) {
            loadMore.style.display = 'none';
        }

        // Make the HTMX request directly
        htmx.ajax('GET', url, {
            target: '#image-results',
            swap: 'innerHTML'
        });

        // Update URL after search
        setTimeout(window.updateURL, 100);
    }

    function clearFilters() {
        // Clear only prompt and model inputs (not NSFW filter)
        const promptInput = document.querySelector('.prompt-input');
        const modelSelect = document.querySelector('.model-select');
        const nsfwFilter = document.getElementById('nsfw-filter');

        promptInput.value = '';
        modelSelect.value = 'all';

        // Update current search parameters (preserve NSFW filter)
        window.currentModel = 'all';
        window.currentSearch = '';
        window.currentPage = 1;

        // Get current NSFW filter value
        const currentNSFWFilter = nsfwFilter.value;

        // Build URL with current NSFW filter
        const params = new URLSearchParams();
        params.set('page', '1');
        params.set('nsfw', currentNSFWFilter);

        const url = `/api/images?${params.toString()}`;

        // Load images with current NSFW filter
        const imageResults = document.getElementById('image-results');
        const loadMore = document.getElementById('load-more');

        // Clear existing content immediately
        imageResults.innerHTML = '<div class="loading">Loading images...</div>';

        // Hide load more temporarily
        if (loadMore) {
            loadMore.style.display = 'none';
        }

        // Make the HTMX request
        htmx.ajax('GET', url, {
            target: '#image-results',
            swap: 'innerHTML'
        });

        // Update URL to preserve NSFW filter
        const newURL = currentNSFWFilter === 'all' ? '/' : `/?nsfw=${currentNSFWFilter}`;
        history.replaceState(null, '', newURL);

        // Update clear button state
        updateClearButtonState();
    }

    function hasActiveFilters() {
        const promptInput = document.querySelector('.prompt-input');
        const modelSelect = document.querySelector('.model-select');

        return (promptInput && promptInput.value.trim() !== '') ||
               (modelSelect && modelSelect.value !== 'all');
    }

    function updateClearButtonState() {
        const clearBtn = document.getElementById('clear-btn');
        if (clearBtn) {
            clearBtn.disabled = !hasActiveFilters();
        }
    }

    // Initialize filter state (will be updated from form values)
    window.currentNSFWFilter = '{{.NSFWFilter}}';
    window.currentModel = '{{if .OthersSelected}}OTHERS{{else if gt .SelectedModelID 0}}{{.SelectedModelID}}{{else}}all{{end}}';
    window.currentSearch = '{{.SearchQuery}}';

    // Function to update URL with current search parameters
    window.updateURL = function() {
        const params = new URLSearchParams();

        const promptInput = document.querySelector('.prompt-input');
        const modelSelect = document.querySelector('.model-select');

        if (promptInput && promptInput.value.trim() !== '') {
            params.set('q', promptInput.value.trim());
        }

        if (modelSelect && modelSelect.value !== 'all') {
            params.set('model', modelSelect.value);
        }

        if (window.currentNSFWFilter) {
            params.set('nsfw', window.currentNSFWFilter);
        }

        const newURL = params.toString() ? `/?${params.toString()}` : '/';
        history.replaceState(null, '', newURL);
    };

    // Function to initialize JavaScript state from form values (set by server)
    window.initializeFromForm = function() {
        // Set current search from prompt input value
        const promptInput = document.querySelector('.prompt-input');
        if (promptInput && promptInput.value) {
            window.currentSearch = promptInput.value;
        }

        // Set current model from select value
        const modelSelect = document.querySelector('.model-select');
        if (modelSelect) {
            window.currentModel = modelSelect.value;
        }

        // Set current NSFW filter from hidden field value
        const nsfwField = document.getElementById('nsfw-filter');
        if (nsfwField) {
            window.currentNSFWFilter = nsfwField.value;
        }
    };

    // Update the image count in the header
    window.updateImageCount = function() {
        const countElement = document.getElementById('image-count');
        if (countElement && typeof window.totalCount !== 'undefined') {
            let countText = `(${window.totalCount} images)`;
            if (window.currentSearch && window.currentSearch.trim() !== '') {
                countText = `(${window.totalCount} results)`;
            }
            countElement.textContent = countText;
        }
    };

    // Toggle filter visibility with Ctrl+D
    document.addEventListener('keydown', function(event) {
        if (event.ctrlKey && event.key === 'd') {
            event.preventDefault();
            const filterButtons = document.querySelector('.filter-buttons');
            filterButtons.classList.toggle('visible');
        }
    });

    // Update hidden NSFW field before each search request
    document.addEventListener('htmx:configRequest', function(event) {
        if (event.detail.path.includes('/search') || event.detail.path.includes('/api/images')) {
            // Update the hidden nsfw field to current filter state
            const nsfwField = document.getElementById('nsfw-filter');
            if (nsfwField && window.currentNSFWFilter) {
                nsfwField.value = window.currentNSFWFilter;
            }

            // Capture current model selection
            const modelSelect = document.querySelector('.model-select');
            if (modelSelect) {
                window.currentModel = modelSelect.value;
            }
        }
    });

    // Update URL after successful HTMX requests
    document.addEventListener('htmx:afterSettle', function(event) {
        if (event.detail.target && (event.detail.target.id === 'image-results')) {
            // Update URL to reflect current search state
            window.updateURL();
            // Rebuild lightbox image list for new search results
            setTimeout(function() {
                if (window.buildLightboxImageList) {
                    window.buildLightboxImageList();
                }
            }, 100);
        }

        // Also rebuild when new pages are loaded via load-more
        if (event.detail.target && (event.detail.target.id === 'unified-grid')) {
            setTimeout(function() {
                if (window.buildLightboxImageList) {
                    window.buildLightboxImageList();
                }
            }, 100);
        }
    });

    // Initialize JavaScript state from form values on page load
    document.addEventListener('DOMContentLoaded', function() {
        // Small delay to ensure all elements are ready
        setTimeout(function() {
            window.initializeFromForm();
            // Build initial lightbox image list
            if (window.buildLightboxImageList) {
                window.buildLightboxImageList();
            }
            // Initialize clear button state
            updateClearButtonState();

            // Add event listeners for form changes
            const promptInput = document.querySelector('.prompt-input');
            const modelSelect = document.querySelector('.model-select');

            if (promptInput) {
                promptInput.addEventListener('input', updateClearButtonState);
            }

            if (modelSelect) {
                modelSelect.addEventListener('change', updateClearButtonState);
            }
        }, 50);
    });

    // Rebuild lightbox image list when new pages are loaded
    document.addEventListener('pageLoaded', function() {
        if (window.buildLightboxImageList) {
            window.buildLightboxImageList();
        }
    });


    // Lightbox functionality
    window.currentLightboxIndex = 0;
    window.lightboxImages = [];
    window.lightboxMetadata = [];

    // Function to decode HTML entities
    window.decodeHtmlEntities = function(text) {
        const textarea = document.createElement('textarea');
        textarea.innerHTML = text;
        return textarea.value;
    };

    window.buildLightboxImageList = function() {
        // Get all image cards from the unified grid
        const imageCards = document.querySelectorAll('#unified-grid .image-card a');
        window.lightboxImages = Array.from(imageCards).map(link => link.href);
        // Extract metadata from data attributes
        window.lightboxMetadata = Array.from(imageCards).map(link => {
            return {
                src: link.href,
                id: link.getAttribute('data-image-id'),
                model: window.decodeHtmlEntities(link.getAttribute('data-model') || ''),
                steps: link.getAttribute('data-steps') || '',
                cfg: link.getAttribute('data-cfg') || '',
                sampler: window.decodeHtmlEntities(link.getAttribute('data-sampler') || ''),
                scheduler: window.decodeHtmlEntities(link.getAttribute('data-scheduler') || ''),
                seed: link.getAttribute('data-seed') || '',
                prompt: window.decodeHtmlEntities(link.getAttribute('data-prompt') || ''),
                negPrompt: window.decodeHtmlEntities(link.getAttribute('data-neg-prompt') || ''),
                loras: link.getAttribute('data-loras') || '',
                is_nsfw: link.getAttribute('data-nsfw') === 'true'
            };
        });
    };

    window.openLightboxFromData = function(element, imageSrc) {
        const model = window.decodeHtmlEntities(element.getAttribute('data-model') || '');
        const steps = element.getAttribute('data-steps') || '';
        const cfg = element.getAttribute('data-cfg') || '';
        const sampler = window.decodeHtmlEntities(element.getAttribute('data-sampler') || '');
        const scheduler = window.decodeHtmlEntities(element.getAttribute('data-scheduler') || '');
        const seed = element.getAttribute('data-seed') || '';
        const prompt = window.decodeHtmlEntities(element.getAttribute('data-prompt') || '');
        const negPrompt = window.decodeHtmlEntities(element.getAttribute('data-neg-prompt') || '');
        const loras = element.getAttribute('data-loras') || '';

        window.openLightbox(imageSrc, element.getAttribute('data-image-id'), model, steps, cfg, sampler, scheduler, seed, prompt, negPrompt, loras);
    };

    window.openLightbox = function(imageSrc, id, model, steps, cfg, sampler, scheduler, seed, prompt, negPrompt, loras) {
        // Build/update the image list
        window.buildLightboxImageList();

        // Find current image index by ID (more reliable than URL comparison)
        window.currentLightboxIndex = window.lightboxMetadata.findIndex(meta => meta.id === id);
        if (window.currentLightboxIndex === -1) {
            // Fallback to URL comparison if ID doesn't work
            window.currentLightboxIndex = window.lightboxImages.findIndex(img => img === imageSrc);
            if (window.currentLightboxIndex === -1) {
                window.currentLightboxIndex = 0;
            }
        }

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        lightboxImg.src = imageSrc;

        // Populate metadata
        window.populateLightboxMetadata(model, steps, cfg, sampler, scheduler, seed, prompt, negPrompt, loras);

        lightbox.classList.add('active');

        // Prevent body scroll
        document.body.style.overflow = 'hidden';

        // Update arrow visibility
        window.updateArrowVisibility();
    };

    window.populateLightboxMetadata = function(model, steps, cfg, sampler, scheduler, seed, prompt, negPrompt, loras) {
        // Clean model name - remove .safetensors extension
        let cleanModel = model || 'Unknown Model';
        if (cleanModel.endsWith('.safetensors')) {
            cleanModel = cleanModel.slice(0, -12); // Remove ".safetensors"
        }

        // Split model name and version if they're combined with " - "
        const modelElement = document.getElementById('lightbox-model');
        const versionElement = document.getElementById('lightbox-version');

        if (cleanModel.includes(' - ')) {
            const parts = cleanModel.split(' - ');
            const modelName = parts[0];
            const versionName = parts.slice(1).join(' - '); // In case there are multiple " - " in the name

            modelElement.textContent = modelName;
            versionElement.textContent = versionName;
            versionElement.style.display = 'block';
        } else {
            modelElement.textContent = cleanModel;
            versionElement.style.display = 'none';
        }

        modelElement.title = model || 'Unknown Model'; // Show full name on hover

        // Parameters
        document.getElementById('lightbox-steps').textContent = steps ? `Steps: ${steps}` : '';
        document.getElementById('lightbox-cfg').textContent = cfg ? `CFG: ${cfg}` : '';
        document.getElementById('lightbox-sampler').textContent = sampler ? `Sampler: ${sampler}` : '';

        // Scheduler - hide if empty
        const schedulerElement = document.getElementById('lightbox-scheduler');
        if (scheduler && scheduler.trim()) {
            schedulerElement.textContent = `Scheduler: ${scheduler}`;
            schedulerElement.style.display = '';
        } else {
            schedulerElement.style.display = 'none';
        }

        // Seed
        document.getElementById('lightbox-seed').textContent = seed ? `Seed: ${seed}` : 'Seed: N/A';

        // LoRAs
        const lorasSection = document.getElementById('lightbox-loras-section');
        const lorasContainer = document.getElementById('lightbox-loras');
        if (loras && loras.trim()) {
            lorasContainer.innerHTML = '';
            const loraItems = loras.split(',');
            loraItems.forEach(loraItem => {
                const [name, weight] = loraItem.split(':');
                if (name && weight) {
                    const loraElement = document.createElement('span');
                    loraElement.className = 'lora-item';
                    loraElement.textContent = `${name.trim()}: ${weight.trim()}`;
                    lorasContainer.appendChild(loraElement);
                }
            });
            lorasSection.style.display = 'block';
        } else {
            lorasSection.style.display = 'none';
        }

        // Prompts
        document.getElementById('lightbox-prompt').textContent = prompt || 'No prompt available';

        const negSection = document.getElementById('lightbox-neg-section');
        const negPromptEl = document.getElementById('lightbox-neg-prompt');
        if (negPrompt && negPrompt.trim()) {
            negPromptEl.textContent = negPrompt;
            negSection.style.display = 'block';
        } else {
            negSection.style.display = 'none';
        }

        // Store current data for copying
        window.currentPromptData = { prompt: prompt || '', negPrompt: negPrompt || '' };
        window.currentSeed = seed || '';

        // Update category toggle button based on current image's NSFW status
        const currentImageData = window.lightboxMetadata[window.currentLightboxIndex];
        const categoryToggleText = document.getElementById('category-toggle-text');
        if (currentImageData && categoryToggleText) {
            categoryToggleText.textContent = currentImageData.is_nsfw ? 'show' : 'hide';
        }

        window.resetPromptGenerationControls();
        window.resetDeleteImageControls();
    };

    window.closeLightbox = function() {
        const lightbox = document.getElementById('lightbox');
        lightbox.classList.remove('active');
        window.resetDeleteImageControls();

        // Restore body scroll
        document.body.style.overflow = '';
    };

    window.showPrevImage = function() {
        if (window.imageDeletionInProgress) return;

        if (window.currentLightboxIndex > 0) {
            window.currentLightboxIndex--;
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = window.lightboxImages[window.currentLightboxIndex];

            // Update metadata for current image
            const metadata = window.lightboxMetadata[window.currentLightboxIndex];
            if (metadata) {
                window.populateLightboxMetadata(metadata.model, metadata.steps, metadata.cfg, metadata.sampler, metadata.scheduler, metadata.seed, metadata.prompt, metadata.negPrompt, metadata.loras);
            }

            window.updateArrowVisibility();
        }
    };

    window.showNextImage = function() {
        if (window.imageDeletionInProgress) return;

        if (window.currentLightboxIndex < window.lightboxImages.length - 1) {
            window.currentLightboxIndex++;
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = window.lightboxImages[window.currentLightboxIndex];

            // Update metadata for current image
            const metadata = window.lightboxMetadata[window.currentLightboxIndex];
            if (metadata) {
                window.populateLightboxMetadata(metadata.model, metadata.steps, metadata.cfg, metadata.sampler, metadata.scheduler, metadata.seed, metadata.prompt, metadata.negPrompt, metadata.loras);
            }

            window.updateArrowVisibility();
        }
    };

    function copyTextToClipboard(text) {
        if (navigator.clipboard && window.isSecureContext) {
            return navigator.clipboard.writeText(text).catch(() => copyTextWithLegacyFallback(text));
        }

        // Clipboard API requires HTTPS outside localhost, so retain a fallback
        // for the app's usual local-network URL.
        return copyTextWithLegacyFallback(text);
    }

    function copyTextWithLegacyFallback(text) {
        return new Promise((resolve, reject) => {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            textArea.style.top = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                const copied = document.execCommand('copy');
                copied ? resolve() : reject(new Error('execCommand failed'));
            } catch (err) {
                reject(err);
            } finally {
                document.body.removeChild(textArea);
            }
        });
    }

    // Generic copy function with visual feedback
    function copyWithFeedback(text, elementId, itemName) {
        if (!text) return;

        copyTextToClipboard(text)
            .then(() => showCopyFeedback(elementId))
            .catch(err => showCopyError(itemName, err));
    }

    function showCopyFeedback(elementId) {
        const element = document.getElementById(elementId);
        if (!element) return;

        const originalBg = element.style.backgroundColor;
        element.style.backgroundColor = '#28a745';
        element.style.color = 'white';

        setTimeout(function() {
            element.style.backgroundColor = originalBg;
            element.style.color = '';
        }, 1000);
    }

    function showCopyError(itemName, err) {
        console.error(`Failed to copy ${itemName}: `, err);
        alert(`Failed to copy ${itemName} to clipboard`);
    }

    window.copyPositivePrompt = function() {
        const text = window.currentPromptData?.prompt;
        copyWithFeedback(text, 'lightbox-prompt', 'positive prompt');
    };

    window.copyNegativePrompt = function() {
        const text = window.currentPromptData?.negPrompt;
        copyWithFeedback(text, 'lightbox-neg-prompt', 'negative prompt');
    };

    window.copySeed = function() {
        copyWithFeedback(window.currentSeed, 'lightbox-seed', 'seed');
    };

    window.promptGenerationInProgress = false;
    window.promptGenerationRequestID = 0;
    window.pendingGeneratedPrompt = null;
    window.pendingGeneratedPromptName = '';
    window.promptGenerationTimer = null;

    window.stopPromptGenerationTimer = function() {
        if (window.promptGenerationTimer !== null) {
            clearInterval(window.promptGenerationTimer);
            window.promptGenerationTimer = null;
        }
    };

    window.startPromptGenerationTimer = function(requestID, targetModelName) {
        const buttonText = document.getElementById('generate-prompt-text');
        const startedAt = Date.now();
        const updateElapsedTime = function() {
            if (requestID !== window.promptGenerationRequestID) return;
            const elapsedSeconds = Math.floor((Date.now() - startedAt) / 1000);
            buttonText.textContent = `Generating for ${targetModelName} · ${elapsedSeconds}s`;
        };

        window.stopPromptGenerationTimer();
        updateElapsedTime();
        window.promptGenerationTimer = setInterval(updateElapsedTime, 1000);
    };

    window.resetPromptGenerationControls = function() {
        const button = document.getElementById('generate-prompt-btn');
        const buttonText = document.getElementById('generate-prompt-text');
        const form = document.getElementById('prompt-remix-form');
        const status = document.getElementById('prompt-generation-status');

        window.stopPromptGenerationTimer();
        button.disabled = false;
        button.classList.remove('is-loading', 'is-success', 'is-error', 'is-ready');
        button.setAttribute('aria-expanded', 'false');
        buttonText.textContent = 'Gen prompt';
        form.hidden = true;
        status.textContent = '';
        status.className = 'prompt-generation-status';
        window.promptGenerationInProgress = false;
        window.promptGenerationRequestID++;
        window.pendingGeneratedPrompt = null;
        window.pendingGeneratedPromptName = '';
    };

    window.promptConceptHints = {
        describe: 'Faithfully reconstruct the image as a standalone prompt.',
        remix: 'Reinterpret the idea while preserving its core subject and mood.',
        next: 'Imagine one meaningful scene that happens afterward.',
        before: 'Imagine one plausible scene that led to this moment.'
    };

    window.updatePromptConceptHint = function() {
        const concept = document.getElementById('prompt-concept').value;
        const hint = document.getElementById('prompt-concept-hint');
        const steering = document.getElementById('prompt-steering');
        hint.textContent = window.promptConceptHints[concept] || '';

        if (concept === 'next') {
            steering.placeholder = 'e.g. Exactly two seconds later, at the instant she hits the water';
        } else if (concept === 'before') {
            steering.placeholder = 'e.g. Three years earlier, before the building was abandoned';
        } else if (concept === 'describe') {
            steering.placeholder = 'e.g. Emphasize the precise clothing and camera position';
        } else {
            steering.placeholder = 'e.g. Make the interaction more intimate and move it indoors';
        }
    };

    window.initializePromptGenerationForm = function() {
        const targetModel = document.getElementById('prompt-target-model');
        const concept = document.getElementById('prompt-concept');

        try {
            const savedTarget = localStorage.getItem('promptTargetModel');
            const savedConcept = localStorage.getItem('promptConcept');
            if (savedTarget && Array.from(targetModel.options).some(option => option.value === savedTarget)) {
                targetModel.value = savedTarget;
            }
            if (savedConcept && Array.from(concept.options).some(option => option.value === savedConcept)) {
                concept.value = savedConcept;
            }
        } catch (error) {
            console.warn('Unable to restore prompt form preferences:', error);
        }

        targetModel.addEventListener('change', function() {
            try {
                localStorage.setItem('promptTargetModel', targetModel.value);
            } catch (error) {
                console.warn('Unable to save target model preference:', error);
            }
        });
        concept.addEventListener('change', function() {
            window.updatePromptConceptHint();
            try {
                localStorage.setItem('promptConcept', concept.value);
            } catch (error) {
                console.warn('Unable to save prompt concept preference:', error);
            }
        });

        window.updatePromptConceptHint();
    };

    window.closePromptGenerationForm = function() {
        const button = document.getElementById('generate-prompt-btn');
        const form = document.getElementById('prompt-remix-form');
        form.hidden = true;
        button.setAttribute('aria-expanded', 'false');
    };

    window.togglePromptGenerationForm = function() {
        if (window.promptGenerationInProgress) return;

        if (window.pendingGeneratedPrompt) {
            window.copyReadyPrompt();
            return;
        }

        const button = document.getElementById('generate-prompt-btn');
        const buttonText = document.getElementById('generate-prompt-text');
        const form = document.getElementById('prompt-remix-form');
        const status = document.getElementById('prompt-generation-status');
        if (button.classList.contains('is-success') || button.classList.contains('is-error')) {
            button.classList.remove('is-success', 'is-error');
            buttonText.textContent = 'Gen prompt';
            status.textContent = '';
            status.className = 'prompt-generation-status';
        }
        form.hidden = !form.hidden;
        button.setAttribute('aria-expanded', String(!form.hidden));
        if (!form.hidden) {
            document.getElementById('prompt-steering').focus();
        }
    };

    window.copyReadyPrompt = async function() {
        if (!window.pendingGeneratedPrompt) return;

        const button = document.getElementById('generate-prompt-btn');
        const buttonText = document.getElementById('generate-prompt-text');
        const status = document.getElementById('prompt-generation-status');

        button.disabled = true;
        try {
            await copyTextToClipboard(window.pendingGeneratedPrompt);
            const targetModelName = window.pendingGeneratedPromptName;
            window.pendingGeneratedPrompt = null;
            window.pendingGeneratedPromptName = '';
            button.classList.remove('is-ready', 'is-error');
            button.classList.add('is-success');
            buttonText.textContent = 'Copied!';
            status.textContent = `${targetModelName} prompt copied to clipboard`;
            status.className = 'prompt-generation-status is-success';
        } catch (error) {
            console.error('Failed to copy generated prompt:', error);
            buttonText.textContent = 'Prompt ready — click to copy';
            status.textContent = '';
            status.className = 'prompt-generation-status';
        } finally {
            button.disabled = false;
        }
    };

    window.submitPromptGeneration = function(event) {
        event.preventDefault();
        window.generatePrompt();
    };

    window.buildPromptGenerationRequest = function(imageID) {
        return {
            image_id: Number(imageID),
            target_model: document.getElementById('prompt-target-model').value,
            concept: document.getElementById('prompt-concept').value,
            steering: document.getElementById('prompt-steering').value.trim()
        };
    };

    window.generatePrompt = async function() {
        const currentImageData = window.lightboxMetadata[window.currentLightboxIndex];
        if (!currentImageData?.id || window.promptGenerationInProgress) return;

        const button = document.getElementById('generate-prompt-btn');
        const buttonText = document.getElementById('generate-prompt-text');
        const form = document.getElementById('prompt-remix-form');
        const status = document.getElementById('prompt-generation-status');
        const targetModelSelect = document.getElementById('prompt-target-model');
        const conceptSelect = document.getElementById('prompt-concept');
        const requestPayload = window.buildPromptGenerationRequest(currentImageData.id);
        const targetModelName = targetModelSelect.options[targetModelSelect.selectedIndex].textContent;
        const conceptName = conceptSelect.options[conceptSelect.selectedIndex].textContent;
        const generationName = `${targetModelName} · ${conceptName}`;

        const requestID = ++window.promptGenerationRequestID;
        window.promptGenerationInProgress = true;
        window.pendingGeneratedPrompt = null;
        window.pendingGeneratedPromptName = '';
        form.hidden = true;
        button.setAttribute('aria-expanded', 'false');
        button.disabled = true;
        button.classList.remove('is-success', 'is-error', 'is-ready');
        button.classList.add('is-loading');
        status.textContent = `Generating ${conceptName.toLowerCase()} prompt…`;
        status.className = 'prompt-generation-status';
        window.startPromptGenerationTimer(requestID, generationName);

        try {
            const response = await fetch('/api/generate-prompt', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestPayload)
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || 'Prompt generation failed');
            }
            if (!data.prompt) {
                throw new Error('The provider returned an empty prompt');
            }
            if (requestID !== window.promptGenerationRequestID) return;

            window.stopPromptGenerationTimer();
            window.pendingGeneratedPrompt = data.prompt;
            window.pendingGeneratedPromptName = generationName;
            button.classList.remove('is-loading');
            button.classList.add('is-ready');
            buttonText.textContent = 'Prompt ready — click to copy';
            status.textContent = '';
            status.className = 'prompt-generation-status';
        } catch (error) {
            if (requestID !== window.promptGenerationRequestID) return;

            window.stopPromptGenerationTimer();
            console.error('Error generating prompt:', error);
            button.classList.remove('is-loading');
            button.classList.add('is-error');
            buttonText.textContent = 'Try again';
            status.textContent = error.message || 'Prompt generation failed';
            status.className = 'prompt-generation-status is-error';
        } finally {
            if (requestID === window.promptGenerationRequestID) {
                window.stopPromptGenerationTimer();
                window.promptGenerationInProgress = false;
                button.disabled = false;
            }
        }
    };

    window.initializePromptGenerationForm();

    window.deleteImageConfirmationTimer = null;
    window.imageDeletionInProgress = false;

    window.resetDeleteImageControls = function() {
        if (window.deleteImageConfirmationTimer !== null) {
            clearTimeout(window.deleteImageConfirmationTimer);
            window.deleteImageConfirmationTimer = null;
        }

        const button = document.getElementById('delete-image-btn');
        const buttonText = document.getElementById('delete-image-text');
        if (!button || !buttonText) return;

        button.disabled = false;
        button.classList.remove('is-confirming');
        buttonText.textContent = 'delete';
        button.title = 'Delete image';
        button.setAttribute('aria-label', 'Delete image');
    };

    window.removeDeletedImageFromView = function(imageID) {
        const deletedID = String(imageID);
        const deletedIndex = window.lightboxMetadata.findIndex(metadata => metadata.id === deletedID);
        const imageLink = document.querySelector(
            `#unified-grid .image-card a[data-image-id="${deletedID}"]`
        );
        const imageCard = imageLink ? imageLink.closest('.image-card') : null;

        if (imageCard) {
            if (window.MasonryManager && window.MasonryManager.removeItem) {
                window.MasonryManager.removeItem(imageCard);
            } else {
                imageCard.remove();
            }
        }

        if (typeof window.totalCount === 'number') {
            window.totalCount = Math.max(0, window.totalCount - 1);
            window.updateImageCount();
        }

        window.buildLightboxImageList();
        if (window.lightboxMetadata.length === 0) {
            window.closeLightbox();
            return;
        }

        window.currentLightboxIndex = Math.min(
            Math.max(deletedIndex, 0),
            window.lightboxMetadata.length - 1
        );
        const metadata = window.lightboxMetadata[window.currentLightboxIndex];
        document.getElementById('lightbox-img').src = metadata.src;
        window.populateLightboxMetadata(
            metadata.model,
            metadata.steps,
            metadata.cfg,
            metadata.sampler,
            metadata.scheduler,
            metadata.seed,
            metadata.prompt,
            metadata.negPrompt,
            metadata.loras
        );
        window.updateArrowVisibility();

        window.modelStatsRequestVersion++;
        window.refreshModelOptions(
            window.currentNSFWFilter || 'all',
            window.modelStatsRequestVersion
        );
    };

    window.deleteCurrentImage = async function() {
        const currentImageData = window.lightboxMetadata[window.currentLightboxIndex];
        if (!currentImageData?.id || window.imageDeletionInProgress) return;

        const button = document.getElementById('delete-image-btn');
        const buttonText = document.getElementById('delete-image-text');

        if (!button.classList.contains('is-confirming')) {
            button.classList.add('is-confirming');
            buttonText.textContent = 'confirm?';
            button.title = 'Click again to permanently delete this image';
            button.setAttribute('aria-label', 'Confirm permanent image deletion');
            window.deleteImageConfirmationTimer = setTimeout(
                window.resetDeleteImageControls,
                4000
            );
            return;
        }

        if (window.deleteImageConfirmationTimer !== null) {
            clearTimeout(window.deleteImageConfirmationTimer);
            window.deleteImageConfirmationTimer = null;
        }

        const imageID = parseInt(currentImageData.id, 10);
        window.imageDeletionInProgress = true;
        button.disabled = true;
        buttonText.textContent = '...';

        try {
            const response = await fetch(`/api/images/${imageID}`, {
                method: 'DELETE'
            });
            const data = await response.json();
            if (!response.ok || !data.success) {
                throw new Error(data.error || 'Image deletion failed');
            }

            window.imageDeletionInProgress = false;
            window.removeDeletedImageFromView(imageID);
        } catch (error) {
            console.error('Error deleting image:', error);
            window.imageDeletionInProgress = false;
            window.resetDeleteImageControls();
            alert('Failed to delete image: ' + error.message);
        }
    };

    window.toggleImageCategory = function() {
        const currentImageData = window.lightboxMetadata[window.currentLightboxIndex];
        if (!currentImageData || !currentImageData.id) return;

        const button = document.getElementById('category-toggle-btn');
        const buttonText = document.getElementById('category-toggle-text');

        // Disable button during request
        button.disabled = true;
        buttonText.textContent = '...';

        // Make API request to toggle category
        fetch('/api/toggle-category', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                image_id: parseInt(currentImageData.id)
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // Update the current metadata
                const newCategory = data.new_category; // 'sfw' or 'nsfw'

                // Update the button text
                buttonText.textContent = newCategory === 'nsfw' ? 'show' : 'hide';

                // Update the current image's metadata in our array
                currentImageData.is_nsfw = newCategory === 'nsfw';

                // Show success feedback
                button.style.backgroundColor = '#28a745';
                button.style.color = 'white';

                setTimeout(function() {
                    button.style.backgroundColor = '';
                    button.style.color = '';
                }, 1000);

                // If we're currently filtering by category, this image should disappear from the view
                // We'll let the user refresh or navigate away naturally

            } else {
                alert('Failed to move image: ' + (data.error || 'Unknown error'));
                buttonText.textContent = 'hide';
            }
        })
        .catch(error => {
            console.error('Error toggling category:', error);
            alert('Failed to move image. Please try again.');
            buttonText.textContent = 'hide';
        })
        .finally(() => {
            button.disabled = false;
        });
    };

    window.updateArrowVisibility = function() {
        const prevBtn = document.querySelector('.lightbox-prev');
        const nextBtn = document.querySelector('.lightbox-next');

        prevBtn.style.opacity = window.currentLightboxIndex > 0 ? '1' : '0.3';
        nextBtn.style.opacity = window.currentLightboxIndex < window.lightboxImages.length - 1 ? '1' : '0.3';

        prevBtn.style.cursor = window.currentLightboxIndex > 0 ? 'pointer' : 'default';
        nextBtn.style.cursor = window.currentLightboxIndex < window.lightboxImages.length - 1 ? 'pointer' : 'default';
    };

    // Close lightbox on click outside content
    document.getElementById('lightbox').addEventListener('click', function(e) {
        // Close if clicking on the lightbox backdrop or the content container (but not its children)
        if (e.target === this || e.target.classList.contains('lightbox-content')) {
            closeLightbox();
        }
    });

    // Prevent clicks on image and metadata from closing lightbox
    document.getElementById('lightbox-img').addEventListener('click', function(e) {
        e.stopPropagation();
    });

    document.querySelector('.lightbox-metadata').addEventListener('click', function(e) {
        e.stopPropagation();
    });

    // Close lightbox with X button
    document.querySelector('.lightbox-close').addEventListener('click', function() {
        closeLightbox();
    });

    // Previous image button
    document.querySelector('.lightbox-prev').addEventListener('click', function() {
        showPrevImage();
    });

    // Next image button
    document.querySelector('.lightbox-next').addEventListener('click', function() {
        showNextImage();
    });

    // Keyboard navigation
    document.addEventListener('keydown', function(e) {
        const lightbox = document.getElementById('lightbox');
        if (lightbox.classList.contains('active')) {
            const promptForm = document.getElementById('prompt-remix-form');
            const promptFormUsesArrowKeys = !promptForm.hidden &&
                (e.key === 'ArrowLeft' || e.key === 'ArrowRight');
            if (promptFormUsesArrowKeys) return;

            switch(e.key) {
                case 'Escape':
                    closeLightbox();
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    showPrevImage();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    showNextImage();
                    break;
            }
        }
    });

    // Global Masonry Manager for single unified grid with infinite scroll
    window.MasonryManager = (function() {
        let masonryInstance = null;
        let mainGrid = null;
        const GUTTER = 15;
        const MIN_COLUMN_WIDTH = 250;
        let globalResizeTimeout;
        let resizeObserver;
        let resizeListenerAttached = false;

        // Calculate optimal column width based on container width
        function calculateColumnWidth(containerWidth) {
            const availableWidth = containerWidth;
            const columns = Math.max(1, Math.floor((availableWidth + GUTTER) / (MIN_COLUMN_WIDTH + GUTTER)));
            const columnWidth = Math.floor((availableWidth - (GUTTER * (columns - 1))) / columns);
            return { columnWidth, columns };
        }

        // Set dynamic column widths for image cards
        function setColumnWidths(grid, columnWidth) {
            const cards = grid.querySelectorAll('.image-card');
            cards.forEach(card => {
                card.style.width = columnWidth + 'px';
            });
        }

        // Initialize masonry for the unified grid (called once on first page load)
        function initializeGrid(grid) {
            if (!grid) return;

            if (masonryInstance) {
                if (mainGrid === grid) {
                    return;
                }
                destroyInstance();
            }

            mainGrid = grid;

            // Get the actual grid container width
            let containerWidth = grid.getBoundingClientRect().width;
            if (containerWidth === 0) {
                containerWidth = grid.parentElement.getBoundingClientRect().width;
            }

            const { columnWidth } = calculateColumnWidth(containerWidth);

            // Set column widths
            setColumnWidths(grid, columnWidth);

            // Wait for images to load
            const images = grid.querySelectorAll('img');
            let loadedCount = 0;
            const totalImages = images.length;

            function createMasonryInstance() {
                // Ensure grid uses full width
                grid.style.width = '100%';

                masonryInstance = new Masonry(grid, {
                    itemSelector: '.image-card',
                    gutter: GUTTER,
                    horizontalOrder: true,
                    containerStyle: { position: 'relative', width: '100%' }
                });

                // Set up resize observer
                setupResizeObserver();

                console.log('Masonry instance initialized');

                return masonryInstance;
            }

            if (totalImages === 0) {
                createMasonryInstance();
            } else {
                images.forEach(img => {
                    if (img.complete) {
                        loadedCount++;
                        if (loadedCount === totalImages) {
                            createMasonryInstance();
                        }
                    } else {
                        img.addEventListener('load', () => {
                            loadedCount++;
                            if (loadedCount === totalImages) {
                                createMasonryInstance();
                            }
                        });
                    }
                });
            }
        }

        // Append new items to existing masonry instance (called when loading more pages)
        function appendItems() {
            if (!masonryInstance || !mainGrid) {
                console.warn('Cannot append items: Masonry instance not initialized');
                return;
            }

            // Get newly added image cards (those without width set)
            const allCards = mainGrid.querySelectorAll('.image-card');
            const newCards = Array.from(allCards).filter(card => !card.style.width);

            if (newCards.length === 0) {
                console.log('No new items to append');
                return;
            }

            console.log('Appending', newCards.length, 'new items to Masonry');

            // Get current column width
            let containerWidth = mainGrid.getBoundingClientRect().width;
            if (containerWidth === 0) {
                containerWidth = mainGrid.parentElement.getBoundingClientRect().width;
            }
            const { columnWidth } = calculateColumnWidth(containerWidth);

            // Set width for new cards
            newCards.forEach(card => {
                card.style.width = columnWidth + 'px';
            });

            // Wait for new images to load before appending
            const newImages = mainGrid.querySelectorAll('.image-card:not([data-loaded]) img');
            let loadedCount = 0;
            const totalImages = newImages.length;

            function appendToMasonry() {
                // Mark all current cards as loaded
                allCards.forEach(card => card.setAttribute('data-loaded', 'true'));

                // Append new elements to Masonry
                masonryInstance.appended(newCards);

                // Force layout update
                masonryInstance.layout();

                console.log('New items appended and layout updated');
            }

            if (totalImages === 0) {
                appendToMasonry();
            } else {
                newImages.forEach(img => {
                    if (img.complete) {
                        loadedCount++;
                        if (loadedCount === totalImages) {
                            appendToMasonry();
                        }
                    } else {
                        img.addEventListener('load', () => {
                            loadedCount++;
                            if (loadedCount === totalImages) {
                                appendToMasonry();
                            }
                        });
                    }
                });
            }
        }

        function removeItem(item) {
            if (!item) return;

            if (masonryInstance && mainGrid && mainGrid.contains(item)) {
                masonryInstance.remove(item);
                masonryInstance.layout();
                return;
            }

            item.remove();
        }

        // Handle resize with debouncing
        function handleResize() {
            clearTimeout(globalResizeTimeout);
            globalResizeTimeout = setTimeout(() => {
                if (masonryInstance && mainGrid && document.contains(mainGrid)) {
                    // Get the actual grid container width
                    let containerWidth = mainGrid.getBoundingClientRect().width;
                    if (containerWidth === 0) {
                        containerWidth = mainGrid.parentElement.getBoundingClientRect().width;
                    }

                    const { columnWidth } = calculateColumnWidth(containerWidth);

                    // Update column widths for all cards
                    setColumnWidths(mainGrid, columnWidth);

                    // Relayout masonry
                    masonryInstance.layout();

                    console.log('Masonry layout updated after resize');
                }
            }, 250);
        }

        // Set up ResizeObserver for better performance
        function setupResizeObserver() {
            if (window.ResizeObserver) {
                if (!resizeObserver) {
                    resizeObserver = new ResizeObserver(handleResize);
                    resizeObserver.observe(document.body);
                }
            } else if (!resizeListenerAttached) {
                window.addEventListener('resize', handleResize);
                resizeListenerAttached = true;
            }
        }

        function destroyInstance() {
            if (resizeObserver) {
                resizeObserver.disconnect();
                resizeObserver = null;
            } else if (resizeListenerAttached) {
                window.removeEventListener('resize', handleResize);
                resizeListenerAttached = false;
            }

            if (masonryInstance) {
                masonryInstance.destroy();
                masonryInstance = null;
            }

            mainGrid = null;
        }

        // Public API
        return {
            initializeGrid: initializeGrid,
            appendItems: appendItems,
            removeItem: removeItem,
            handleResize: handleResize,
            destroyInstance: destroyInstance
        };
    })();
    </script>
