<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{{.Title}}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>
    <link rel="stylesheet" href="/static/styles.css?v=20261008-gallery">
</head>
<body>
    <div class="container">
        <header class="header" id="site-header">
            <h1 class="brand">
                <span class="brand-mark" aria-hidden="true"></span>
                <span class="brand-text">
                    <span class="brand-title">{{.Title}}</span>
                    <span class="image-count" id="image-count">{{.TotalCount}} images</span>
                </span>
            </h1>
            <form class="search-form" hx-get="/search" hx-target="#image-results" hx-trigger="submit, change from:select[name='model'], keyup changed delay:500ms from:input[name='q']" hx-swap="innerHTML">
                <div class="search-inputs">
                    <label class="prompt-field">
                        <svg class="prompt-field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.2 4.2a1 1 0 0 1-1.4 1.4l-4.2-4.2A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
                        <span class="visually-hidden">Search prompts</span>
                        <input type="text" class="prompt-input" name="q" placeholder="Search prompts…" value="{{.SearchQuery}}" autocomplete="off" spellcheck="false">
                    </label>
                    <select class="model-select" name="model" aria-label="Model">
                        <option value="all">All Models</option>
                        {{range $model := .Models}}
                            <option value="{{$model.ID}}"{{if and (gt $.SelectedModelID 0) (eq $model.ID $.SelectedModelID)}} selected{{end}}>{{$model.Name}}{{if $model.VersionName}} - {{$model.VersionName}}{{end}} ({{$model.ImageCount}})</option>
                        {{end}}
                        {{if gt .OthersCount 0}}
                            <option value="OTHERS"{{if .OthersSelected}} selected{{end}}>Others ({{.OthersCount}})</option>
                        {{end}}
                        </select>
                    <div class="media-toggle" role="group" aria-label="Filter by media type">
                        <button type="button" class="media-toggle-btn{{if .ShowImages}} active{{end}}"
                                data-media-type="image" aria-pressed="{{.ShowImages}}" title="Images"
                                onclick="toggleMediaType('image')">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm0 13.4h16v-1.6l-4.6-5.4-3.2 3.9-2.4-2.6L4 17v.4Zm4.4-7a1.9 1.9 0 1 0 0-3.8 1.9 1.9 0 0 0 0 3.8Z"/>
                            </svg>
                            <span class="visually-hidden">Images</span>
                        </button>
                        <button type="button" class="media-toggle-btn{{if .ShowVideos}} active{{end}}"
                                data-media-type="video" aria-pressed="{{.ShowVideos}}" title="Videos"
                                onclick="toggleMediaType('video')">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h8A2.5 2.5 0 0 1 16 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-8A2.5 2.5 0 0 1 3 17.5v-11Zm15 4.1 3.2-2.2a.6.6 0 0 1 .9.5v6.2a.6.6 0 0 1-.9.5L18 13.4v-2.8Z"/>
                            </svg>
                            <span class="visually-hidden">Videos</span>
                        </button>
                    </div>
                </div>
                <input type="hidden" name="nsfw" id="nsfw-filter" value="{{.NSFWFilter}}">
                <input type="hidden" name="media" id="media-filter" value="{{.MediaFilter}}">
                <input type="hidden" name="page" value="1">
                <div class="search-actions">
                    <button type="submit" class="search-btn visually-hidden">Search</button>
                    <button type="button" class="clear-btn" id="clear-btn" onclick="clearFilters()" title="Clear all filters" aria-label="Clear all filters" disabled>
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.7 5.3 12 10.6l5.3-5.3a1 1 0 1 1 1.4 1.4L13.4 12l5.3 5.3a1 1 0 0 1-1.4 1.4L12 13.4l-5.3 5.3a1 1 0 0 1-1.4-1.4l5.3-5.3-5.3-5.3a1 1 0 0 1 1.4-1.4Z"/></svg>
                    </button>
                </div>
            </form>

            <div class="filter-buttons" role="group" aria-label="Content rating">
                <button type="button" data-nsfw-filter="all" class="filter-btn{{if eq .NSFWFilter "all"}} active{{end}}" onclick="setNSFWFilter('all')">All</button>
                <button type="button" data-nsfw-filter="sfw" class="filter-btn{{if eq .NSFWFilter "sfw"}} active{{end}}" onclick="setNSFWFilter('sfw')">SFW</button>
                <button type="button" data-nsfw-filter="nsfw" class="filter-btn{{if eq .NSFWFilter "nsfw"}} active{{end}}" onclick="setNSFWFilter('nsfw')">NSFW</button>
            </div>
        </header>

        <main class="gallery">
            <div id="image-results" hx-get="{{.InitialURL}}" hx-trigger="load">
                <div class="loading">Loading images…</div>
            </div>

            <div id="load-more" style="display: none;" hx-target="#unified-grid" hx-swap="beforeend"
                 hx-trigger="intersect once" hx-indicator=".loading">
                <div class="loading">Loading more…</div>
            </div>
        </main>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Media viewer">
        <button type="button" class="lightbox-close" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.7 5.3 12 10.6l5.3-5.3a1 1 0 1 1 1.4 1.4L13.4 12l5.3 5.3a1 1 0 0 1-1.4 1.4L12 13.4l-5.3 5.3a1 1 0 0 1-1.4-1.4l5.3-5.3-5.3-5.3a1 1 0 0 1 1.4-1.4Z"/></svg>
        </button>
        <button type="button" class="lightbox-nav lightbox-prev" aria-label="Previous">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14.7 5.3a1 1 0 0 1 0 1.4L9.4 12l5.3 5.3a1 1 0 0 1-1.4 1.4l-6-6a1 1 0 0 1 0-1.4l6-6a1 1 0 0 1 1.4 0Z"/></svg>
        </button>
        <button type="button" class="lightbox-nav lightbox-next" aria-label="Next">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.3 5.3a1 1 0 0 1 1.4 0l6 6a1 1 0 0 1 0 1.4l-6 6a1 1 0 0 1-1.4-1.4l5.3-5.3-5.3-5.3a1 1 0 0 1 0-1.4Z"/></svg>
        </button>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="">
            <video id="lightbox-video" controls loop playsinline preload="metadata" hidden></video>
            <aside class="lightbox-metadata">
                <div class="lightbox-model-info">
                    <span class="panel-eyebrow" id="lightbox-counter"></span>
                    <h3 id="lightbox-model"></h3>
                    <p class="lightbox-version" id="lightbox-version"></p>
                </div>
                <dl class="lightbox-params">
                    <div class="param"><dt>Steps</dt><dd id="lightbox-steps"></dd></div>
                    <div class="param"><dt>CFG</dt><dd id="lightbox-cfg"></dd></div>
                    <div class="param"><dt>Sampler</dt><dd id="lightbox-sampler"></dd></div>
                    <div class="param"><dt>Scheduler</dt><dd id="lightbox-scheduler"></dd></div>
                    <div class="param param-seed clickable-seed" onclick="copySeed()" title="Click to copy seed"><dt>Seed</dt><dd id="lightbox-seed"></dd></div>
                </dl>
                <div class="lightbox-loras-section" id="lightbox-loras-section">
                    <strong class="section-label">LoRAs</strong>
                    <div class="loras-container" id="lightbox-loras"></div>
                </div>
                <div class="lightbox-prompts">
                    <div class="lightbox-prompt-section">
                        <strong class="section-label">Prompt <span class="copy-hint">click to copy</span></strong>
                        <p id="lightbox-prompt" class="clickable-prompt" onclick="copyPositivePrompt()" title="Click to copy positive prompt"></p>
                    </div>
                    <div class="lightbox-prompt-section" id="lightbox-neg-section">
                        <strong class="section-label">Negative <span class="copy-hint">click to copy</span></strong>
                        <p id="lightbox-neg-prompt" class="clickable-prompt is-negative" onclick="copyNegativePrompt()" title="Click to copy negative prompt"></p>
                    </div>
                </div>
                <div class="lightbox-actions">
                    <div class="prompt-generation-controls">
                        <button id="generate-prompt-btn" class="generate-prompt-btn" type="button" onclick="togglePromptGenerationForm()" aria-expanded="false" aria-controls="prompt-remix-form">
                            <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M11 2.6a1 1 0 0 1 1.9 0l1.2 3.6a3 3 0 0 0 1.9 1.9l3.6 1.2a1 1 0 0 1 0 1.9L16 12.4a3 3 0 0 0-1.9 1.9l-1.2 3.6a1 1 0 0 1-1.9 0l-1.2-3.6a3 3 0 0 0-1.9-1.9l-3.6-1.2a1 1 0 0 1 0-1.9L8 8.1A3 3 0 0 0 9.9 6.2L11 2.6ZM19 15.5a.6.6 0 0 1 1.1 0l.4 1.2a1.6 1.6 0 0 0 1 1l1.1.4a.6.6 0 0 1 0 1.1l-1.1.4a1.6 1.6 0 0 0-1 1l-.4 1.1a.6.6 0 0 1-1.1 0l-.4-1.1a1.6 1.6 0 0 0-1-1l-1.2-.4a.6.6 0 0 1 0-1.1l1.2-.4a1.6 1.6 0 0 0 1-1l.4-1.2Z"/></svg>
                            <span id="generate-prompt-text">Gen prompt</span>
                            <span class="prompt-loader" aria-hidden="true"></span>
                        </button>
                        <form id="prompt-remix-form" class="prompt-remix-form" onsubmit="submitPromptGeneration(event)" hidden>
                            <div class="prompt-remix-grid">
                                <label class="prompt-remix-field">
                                    <span>Target</span>
                                    <select id="prompt-target-model">
                                        <option value="anima">Anima</option>
                                        <option value="krea-2">Krea 2</option>
                                    </select>
                                </label>
                                <label class="prompt-remix-field">
                                    <span>Concept</span>
                                    <select id="prompt-concept">
                                        <option value="describe">Describe</option>
                                        <option value="remix" selected>Remix</option>
                                        <option value="next">Next</option>
                                        <option value="before">Before</option>
                                    </select>
                                </label>
                            </div>
                            <p id="prompt-concept-hint" class="prompt-concept-hint"></p>
                            <label class="prompt-remix-field prompt-remix-steering">
                                <span>Creative direction <small>optional</small></span>
                                <textarea id="prompt-steering" maxlength="2000" rows="3" placeholder="e.g. Exactly two seconds later, at the instant she hits the water"></textarea>
                            </label>
                            <div class="prompt-remix-actions">
                                <button class="prompt-remix-submit" type="submit">Generate</button>
                                <button class="prompt-remix-cancel" type="button" onclick="closePromptGenerationForm()">Cancel</button>
                            </div>
                        </form>
                        <p id="prompt-generation-status" class="prompt-generation-status" aria-live="polite"></p>
                    </div>
                    <button id="category-toggle-btn" class="category-toggle-btn action-btn" onclick="toggleImageCategory()" title="Move to other category">
                        <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2.3 2.3a1 1 0 0 1 1.4 0l18 18a1 1 0 0 1-1.4 1.4l-3.3-3.3A10.6 10.6 0 0 1 12 19.5c-5 0-8.6-3.4-10.2-6.9a1.5 1.5 0 0 1 0-1.2 13 13 0 0 1 3.4-4.6L2.3 3.7a1 1 0 0 1 0-1.4Zm4.3 5.7a11 11 0 0 0-2.9 4 8.9 8.9 0 0 0 11.5 5.1l-1.6-1.6a4 4 0 0 1-5.1-5.1L6.6 8Zm5.4-3.5c5 0 8.6 3.4 10.2 6.9.2.4.2.8 0 1.2a13 13 0 0 1-2.4 3.6l-1.4-1.4a11 11 0 0 0 1.9-2.8A8.9 8.9 0 0 0 9.9 6.7L8.3 5.1A10.6 10.6 0 0 1 12 4.5Z"/></svg>
                        <span id="category-toggle-text">hide</span>
                    </button>
                    <button id="delete-image-btn" class="delete-image-btn action-btn" type="button" onclick="deleteCurrentImage()" title="Delete image">
                        <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 2h6a1 1 0 0 1 1 1v1h4a1 1 0 1 1 0 2h-1l-.9 13.1A3 3 0 0 1 15.1 22H8.9a3 3 0 0 1-3-2.9L5 6H4a1 1 0 0 1 0-2h4V3a1 1 0 0 1 1-1Zm-2 4 .9 13a1 1 0 0 0 1 .9h6.2a1 1 0 0 0 1-.9L17 6H7Zm3 3a1 1 0 0 1 1 1v6a1 1 0 1 1-2 0v-6a1 1 0 0 1 1-1Zm4 0a1 1 0 0 1 1 1v6a1 1 0 1 1-2 0v-6a1 1 0 0 1 1-1Z"/></svg>
                        <span id="delete-image-text">delete</span>
                    </button>
                    <button id="civitai-upload-btn" class="civitai-upload-btn action-btn" type="button" onclick="sendToCivitai()" title="Upload to Civitai as draft post">
                        <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3a1 1 0 0 1 .7.3l4.5 4.5a1 1 0 0 1-1.4 1.4L13 6.4V15a1 1 0 1 1-2 0V6.4L8.2 9.2a1 1 0 0 1-1.4-1.4l4.5-4.5A1 1 0 0 1 12 3ZM4 14a1 1 0 0 1 1 1v3a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3a1 1 0 1 1 2 0v3a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-3a1 1 0 0 1 1-1Z"/></svg>
                        <span id="civitai-upload-text">civitai</span>
                    </button>
                    <a id="civitai-post-link" class="civitai-post-link" href="#" target="_blank" rel="noopener" hidden>Open draft on Civitai ↗</a>
                </div>
                <p id="civitai-upload-status" class="civitai-upload-status" aria-live="polite" hidden></p>
            </aside>
        </div>
    </div>

    <script>
    window.modelStatsRequestVersion = 0;

    window.refreshModelOptions = async function(filter, requestVersion) {
        const modelSelect = document.querySelector('.model-select');
        if (!modelSelect) return;

        const selectedModel = modelSelect.value;
        const media = window.currentMediaFilter || 'all';

        try {
            const response = await fetch(`/api/models?nsfw=${encodeURIComponent(filter)}&media=${encodeURIComponent(media)}`);
            if (!response.ok) {
                throw new Error(`Model statistics request failed with status ${response.status}`);
            }

            const stats = await response.json();
            if (requestVersion !== window.modelStatsRequestVersion) return;

            const allModelsOption = document.createElement('option');
            allModelsOption.value = 'all';
            allModelsOption.textContent = 'All Models';
            modelSelect.replaceChildren(allModelsOption);

            stats.models.forEach(model => {
                const option = document.createElement('option');
                option.value = String(model.id);
                const version = model.version_name ? ` - ${model.version_name}` : '';
                option.textContent = `${model.name}${version} (${model.image_count})`;
                modelSelect.appendChild(option);
            });

            if (stats.others_count > 0) {
                const othersOption = document.createElement('option');
                othersOption.value = 'OTHERS';
                othersOption.textContent = `Others (${stats.others_count})`;
                modelSelect.appendChild(othersOption);
            }

            const selectedModelStillExists = Array.from(modelSelect.options)
                .some(option => option.value === selectedModel);
            modelSelect.value = selectedModelStillExists ? selectedModel : 'all';
            window.currentModel = modelSelect.value;
            updateClearButtonState();
        } catch (error) {
            console.error('Unable to refresh model statistics:', error);
        }
    };

    async function setNSFWFilter(filter) {
        // Update hidden input
        document.getElementById('nsfw-filter').value = filter;

        // Update active button
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        const activeButton = document.querySelector(`[data-nsfw-filter="${filter}"]`);
        if (activeButton) {
            activeButton.classList.add('active');
        }

        // Update current search parameters and reset page
        window.currentNSFWFilter = filter;
        window.currentPage = 1; // Reset to page 1
        const requestVersion = ++window.modelStatsRequestVersion;

        // Refresh model counts and drop a model selection that is unavailable
        // in the newly selected category before loading the image grid.
        await window.refreshModelOptions(filter, requestVersion);
        if (requestVersion !== window.modelStatsRequestVersion) return;

        // Trigger search with new filter
        const promptInput = document.querySelector('.prompt-input');
        const modelSelect = document.querySelector('.model-select');
        const promptValue = promptInput.value;
        const modelValue = modelSelect.value;

        window.currentSearch = promptValue;
        window.currentModel = modelValue;
        const url = window.gridURL(1);

        // Reset and update the request
        const imageResults = document.getElementById('image-results');
        const loadMore = document.getElementById('load-more');

        // Clear existing content immediately
        imageResults.innerHTML = '<div class="loading">Loading images...</div>';

        // Hide load more temporarily
        if (loadMore) {
            loadMore.style.display = 'none';
        }

        // Make the HTMX request directly
        htmx.ajax('GET', url, {
            target: '#image-results',
            swap: 'innerHTML'
        });

        // Update URL after search
        setTimeout(window.updateURL, 100);
    }

    function clearFilters() {
        // Clear only prompt and model inputs (not NSFW filter)
        const promptInput = document.querySelector('.prompt-input');
        const modelSelect = document.querySelector('.model-select');

        promptInput.value = '';
        modelSelect.value = 'all';

        // Update current search parameters (preserve NSFW filter)
        window.currentModel = 'all';
        window.currentSearch = '';
        window.currentPage = 1;

        // Build URL with the filters we keep (NSFW and media type)
        const url = window.gridURL(1);

        // Load images with current NSFW filter
        const imageResults = document.getElementById('image-results');
        const loadMore = document.getElementById('load-more');

        // Clear existing content immediately
        imageResults.innerHTML = '<div class="loading">Loading images...</div>';

        // Hide load more temporarily
        if (loadMore) {
            loadMore.style.display = 'none';
        }

        // Make the HTMX request
        htmx.ajax('GET', url, {
            target: '#image-results',
            swap: 'innerHTML'
        });

        // Update URL to preserve the NSFW and media filters
        window.updateURL();

        // Update clear button state
        updateClearButtonState();
    }

    function hasActiveFilters() {
        const promptInput = document.querySelector('.prompt-input');
        const modelSelect = document.querySelector('.model-select');

        return (promptInput && promptInput.value.trim() !== '') ||
               (modelSelect && modelSelect.value !== 'all');
    }

    function updateClearButtonState() {
        const clearBtn = document.getElementById('clear-btn');
        if (clearBtn) {
            clearBtn.disabled = !hasActiveFilters();
        }
    }

    // Initialize filter state (will be updated from form values)
    window.currentNSFWFilter = '{{.NSFWFilter}}';
    window.currentMediaFilter = '{{.MediaFilter}}';
    window.currentModel = '{{if .OthersSelected}}OTHERS{{else if gt .SelectedModelID 0}}{{.SelectedModelID}}{{else}}all{{end}}';
    window.currentSearch = '{{.SearchQuery}}';

    // Single source of truth for the grid query string, shared by the initial
    // load, every filter change and the infinite-scroll trigger.
    window.buildGridParams = function(page) {
        const params = new URLSearchParams();
        params.set('page', String(page || 1));
        params.set('nsfw', window.currentNSFWFilter || 'sfw');

        if (window.currentMediaFilter && window.currentMediaFilter !== 'all') {
            params.set('media', window.currentMediaFilter);
        }

        if (window.currentSearch && window.currentSearch.trim() !== '') {
            params.set('q', window.currentSearch.trim());
        }

        if (window.currentModel && window.currentModel !== 'all') {
            params.set('model', window.currentModel);
        }

        return params;
    };

    window.gridURL = function(page) {
        const params = window.buildGridParams(page);
        const endpoint = (params.get('q') || params.get('model')) ? '/search' : '/api/images';
        return `${endpoint}?${params.toString()}`;
    };

    // Reload the grid from scratch with the current filters.
    window.reloadGrid = function() {
        window.currentPage = 1;

        const imageResults = document.getElementById('image-results');
        const loadMore = document.getElementById('load-more');

        imageResults.innerHTML = '<div class="loading">Loading images...</div>';
        if (loadMore) {
            loadMore.style.display = 'none';
        }

        htmx.ajax('GET', window.gridURL(1), {
            target: '#image-results',
            swap: 'innerHTML'
        });
    };

    // Segmented image/video toggle. Both halves on means "everything"; turning
    // the last one off would show nothing, so it snaps back on instead.
    window.toggleMediaType = async function(type) {
        const buttons = Array.from(document.querySelectorAll('.media-toggle-btn'));
        const button = buttons.find(candidate => candidate.dataset.mediaType === type);
        if (!button) return;

        button.classList.toggle('active');
        if (!buttons.some(candidate => candidate.classList.contains('active'))) {
            button.classList.add('active');
            return;
        }

        const active = buttons.filter(candidate => candidate.classList.contains('active'))
            .map(candidate => candidate.dataset.mediaType);
        buttons.forEach(candidate => {
            candidate.setAttribute('aria-pressed', String(candidate.classList.contains('active')));
        });

        window.currentMediaFilter = active.length === 1 ? active[0] : 'all';

        const mediaField = document.getElementById('media-filter');
        if (mediaField) {
            mediaField.value = window.currentMediaFilter;
        }

        // Model counts depend on the media types in view
        const requestVersion = ++window.modelStatsRequestVersion;
        await window.refreshModelOptions(window.currentNSFWFilter || 'sfw', requestVersion);
        if (requestVersion !== window.modelStatsRequestVersion) return;

        window.reloadGrid();
        setTimeout(window.updateURL, 100);
    };

    // Function to update URL with current search parameters
    window.updateURL = function() {
        const params = new URLSearchParams();

        const promptInput = document.querySelector('.prompt-input');
        const modelSelect = document.querySelector('.model-select');

        if (promptInput && promptInput.value.trim() !== '') {
            params.set('q', promptInput.value.trim());
        }

        if (modelSelect && modelSelect.value !== 'all') {
            params.set('model', modelSelect.value);
        }

        if (window.currentNSFWFilter) {
            params.set('nsfw', window.currentNSFWFilter);
        }

        if (window.currentMediaFilter && window.currentMediaFilter !== 'all') {
            params.set('media', window.currentMediaFilter);
        }

        const newURL = params.toString() ? `/?${params.toString()}` : '/';
        history.replaceState(null, '', newURL);
    };

    // Function to initialize JavaScript state from form values (set by server)
    window.initializeFromForm = function() {
        // Set current search from prompt input value
        const promptInput = document.querySelector('.prompt-input');
        if (promptInput && promptInput.value) {
            window.currentSearch = promptInput.value;
        }

        // Set current model from select value
        const modelSelect = document.querySelector('.model-select');
        if (modelSelect) {
            window.currentModel = modelSelect.value;
        }

        // Set current NSFW filter from hidden field value
        const nsfwField = document.getElementById('nsfw-filter');
        if (nsfwField) {
            window.currentNSFWFilter = nsfwField.value;
        }

        const mediaField = document.getElementById('media-filter');
        if (mediaField && mediaField.value) {
            window.currentMediaFilter = mediaField.value;
        }
    };

    // Update the image count in the header
    window.updateImageCount = function() {
        const countElement = document.getElementById('image-count');
        if (countElement && typeof window.totalCount !== 'undefined') {
            const nouns = { image: 'images', video: 'videos' };
            const noun = nouns[window.currentMediaFilter] || 'items';

    // The header slides away while scrolling down through the grid and comes

    (function() {
        const header = document.getElementById('site-header');
        const REVEAL_ZONE = 120;
        const THRESHOLD = 6;
        let lastY = window.scrollY;
        let ticking = false;

        function update() {
            ticking = false;
            const y = window.scrollY;
            const delta = y - lastY;
            if (Math.abs(delta) < THRESHOLD) return;

            const searching = header.contains(document.activeElement) &&
                document.activeElement.matches('input, select');
            header.classList.toggle('is-hidden', delta > 0 && y > REVEAL_ZONE && !searching);
            header.classList.toggle('is-scrolled', y > 8);
            lastY = y;
        }

        window.addEventListener('scroll', function() {
            if (!ticking) {
                ticking = true;
                requestAnimationFrame(update);
            }
        }, { passive: true });

        header.addEventListener('focusin', function() {
            header.classList.remove('is-hidden');
        });
    })();

    window.setLightboxMedia = function(meta) {
        const image = document.getElementById('lightbox-img');
        const video = document.getElementById('lightbox-video');

        video.pause();

        if (!meta || meta.mediaType !== 'video') {
            video.hidden = true;
            video.removeAttribute('src');
            video.load();
            image.hidden = false;
            image.src = meta ? meta.src : '';
            return;
        }

        image.hidden = true;
        image.removeAttribute('src');
        video.hidden = false;
        video.src = meta.src;
        video.currentTime = 0;
        video.muted = false;

        const playback = video.play();
        if (playback && playback.catch) {
            // Some browsers still refuse unmuted autoplay; fall back rather
            // than leaving a frozen first frame.
            playback.catch(function() {
                video.muted = true;
                const retry = video.play();
                if (retry && retry.catch) retry.catch(function() {});
            });
        }
    };

    window.populateLightboxMetadata = function(model, steps, cfg, sampler, scheduler, seed, prompt, negPrompt, loras) {
        // The display string is "name - version", with an empty version for
        // local checkpoints and hosted generators ("name - " or even " - ").
        const modelParts = (model || '').split(' - ');
        let modelName = modelParts[0].trim().replace(/\.safetensors$/, '');
        const versionName = modelParts.slice(1).join(' - ').trim(); // In case there are multiple " - " in the name
        if (modelName === '') modelName = 'Unknown Model';

        const modelElement = document.getElementById('lightbox-model');
        const versionElement = document.getElementById('lightbox-version');
        modelElement.textContent = modelName;
        versionElement.textContent = versionName;
        versionElement.hidden = versionName === '';
        // Reset the Civitai upload affordances for the newly shown media.
        // The button only applies to videos; the text lives in a span so the
        // upload handler can rewrite it without touching the button node.
        const civitaiBtn = document.getElementById('civitai-upload-btn');
        const civitaiStatus = document.getElementById('civitai-upload-status');
        const civitaiLink = document.getElementById('civitai-post-link');
        if (civitaiBtn && civitaiStatus && civitaiLink) {
            const shownMeta = (window.lightboxMetadata || [])[window.currentLightboxIndex];
            civitaiBtn.disabled = false;
            civitaiBtn.hidden = !shownMeta || shownMeta.mediaType !== 'video';
            let civitaiText = document.getElementById('civitai-upload-text');
            if (!civitaiText) {
                civitaiText = document.createElement('span');
                civitaiText.id = 'civitai-upload-text';
                civitaiBtn.appendChild(civitaiText);
            }
            civitaiText.textContent = 'civitai';
            civitaiLink.hidden = true;
            civitaiLink.removeAttribute('href');
            civitaiStatus.hidden = true;
            civitaiStatus.textContent = '';
        }

        modelElement.title = model || 'Unknown Model'; // Show full name on hover

        // Parameters: each value sits in a labelled row that hides when empty
        const setParam = function(id, value) {
            const element = document.getElementById(id);
            const text = value ? String(value).trim() : '';
            element.textContent = text;
            element.closest('.param').hidden = text === '';
        };
        setParam('lightbox-steps', steps);
        setParam('lightbox-cfg', cfg);
        setParam('lightbox-sampler', sampler);
        setParam('lightbox-scheduler', scheduler);
        setParam('lightbox-seed', seed);

        // LoRAs
        const lorasSection = document.getElementById('lightbox-loras-section');
        const lorasContainer = document.getElementById('lightbox-loras');
        if (loras && loras.trim()) {
            lorasContainer.innerHTML = '';
            const loraItems = loras.split(',');
            loraItems.forEach(loraItem => {
                const [name, weight] = loraItem.split(':');
                if (name && weight) {
                    const loraElement = document.createElement('span');
                    loraElement.className = 'lora-item';
                    loraElement.textContent = `${name.trim()}: ${weight.trim()}`;
                    // The chip is ellipsised, so keep the full name reachable
                    loraElement.title = `${name.trim()}: ${weight.trim()}`;
                    lorasContainer.appendChild(loraElement);
                }
            });
            lorasSection.style.display = 'block';
        } else {
            lorasSection.style.display = 'none';
        }

        // Prompts
        document.getElementById('lightbox-prompt').textContent = prompt || 'No prompt available';

        const negSection = document.getElementById('lightbox-neg-section');
        const negPromptEl = document.getElementById('lightbox-neg-prompt');
        if (negPrompt && negPrompt.trim()) {
            negPromptEl.textContent = negPrompt;
            negSection.style.display = 'block';
        } else {
            negSection.style.display = 'none';
        }

        // Store current data for copying
        window.currentPromptData = { prompt: prompt || '', negPrompt: negPrompt || '' };
        window.currentSeed = seed || '';

        // Update category toggle button based on current image's NSFW status
        const currentImageData = window.lightboxMetadata[window.currentLightboxIndex];
        const categoryToggleText = document.getElementById('category-toggle-text');
        if (currentImageData && categoryToggleText) {
            categoryToggleText.textContent = currentImageData.is_nsfw ? 'show' : 'hide';
        }

        window.resetPromptGenerationControls();
        window.resetDeleteImageControls();
    };

    function copyTextToClipboard(text) {
        if (navigator.clipboard && window.isSecureContext) {
            return navigator.clipboard.writeText(text).catch(() => copyTextWithLegacyFallback(text));
        }

        // Clipboard API requires HTTPS outside localhost, so retain a fallback
        // for the app's usual local-network URL.
        return copyTextWithLegacyFallback(text);
    }

    function copyTextWithLegacyFallback(text) {
        return new Promise((resolve, reject) => {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            textArea.style.top = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                const copied = document.execCommand('copy');
                copied ? resolve() : reject(new Error('execCommand failed'));
            } catch (err) {
                reject(err);
            } finally {
                document.body.removeChild(textArea);
            }
        });
    }

    // Generic copy function with visual feedback
    function copyWithFeedback(text, elementId, itemName) {
        if (!text) return;

        copyTextToClipboard(text)
            .then(() => showCopyFeedback(elementId))
            .catch(err => showCopyError(itemName, err));
    }

    function showCopyFeedback(elementId) {
        const element = document.getElementById(elementId);
        if (!element) return;

        // The seed value sits inside its labelled row; flash the whole row
        const target = element.closest('.param') || element;
        target.classList.remove('is-copied');
        void target.offsetWidth; // restart the animation on repeated copies
        target.classList.add('is-copied');
        setTimeout(function() {
            target.classList.remove('is-copied');
        }, 1000);
    }

    function showCopyError(itemName, err) {
        console.error(`Failed to copy ${itemName}: `, err);
        alert(`Failed to copy ${itemName} to clipboard`);
    }

    window.generatePrompt = async function() {
        const currentImageData = window.lightboxMetadata[window.currentLightboxIndex];
        if (!currentImageData?.id || window.promptGenerationInProgress) return;

        const button = document.getElementById('generate-prompt-btn');
        const buttonText = document.getElementById('generate-prompt-text');
        const form = document.getElementById('prompt-remix-form');
        const status = document.getElementById('prompt-generation-status');
        const targetModelSelect = document.getElementById('prompt-target-model');
        const conceptSelect = document.getElementById('prompt-concept');
        const requestPayload = window.buildPromptGenerationRequest(currentImageData.id);
        const targetModelName = targetModelSelect.options[targetModelSelect.selectedIndex].textContent;
        const conceptName = conceptSelect.options[conceptSelect.selectedIndex].textContent;
        const generationName = `${targetModelName} · ${conceptName}`;

        const requestID = ++window.promptGenerationRequestID;
        window.promptGenerationInProgress = true;
        window.pendingGeneratedPrompt = null;
        window.pendingGeneratedPromptName = '';
        form.hidden = true;
        button.setAttribute('aria-expanded', 'false');
        button.disabled = true;
        button.classList.remove('is-success', 'is-error', 'is-ready');
        button.classList.add('is-loading');
        status.textContent = `Generating ${conceptName.toLowerCase()} prompt…`;
        status.className = 'prompt-generation-status';
        window.startPromptGenerationTimer(requestID, generationName);

        try {
            const response = await fetch('/api/generate-prompt', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestPayload)
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || 'Prompt generation failed');
            }
            if (!data.prompt) {
                throw new Error('The provider returned an empty prompt');
            }
            if (requestID !== window.promptGenerationRequestID) return;

            window.stopPromptGenerationTimer();
            window.pendingGeneratedPrompt = data.prompt;
            window.pendingGeneratedPromptName = generationName;
            button.classList.remove('is-loading');
            button.classList.add('is-ready');
            buttonText.textContent = 'Prompt ready — click to copy';
            status.textContent = '';
            status.className = 'prompt-generation-status';
        } catch (error) {
            if (requestID !== window.promptGenerationRequestID) return;

            window.stopPromptGenerationTimer();
            console.error('Error generating prompt:', error);
            button.classList.remove('is-loading');
            button.classList.add('is-error');
            buttonText.textContent = 'Try again';
            status.textContent = error.message || 'Prompt generation failed';
            status.className = 'prompt-generation-status is-error';
        } finally {
            if (requestID === window.promptGenerationRequestID) {
                window.stopPromptGenerationTimer();
                window.promptGenerationInProgress = false;
                button.disabled = false;
            }
        }
    };

    window.initializePromptGenerationForm();

    window.deleteImageConfirmationTimer = null;
    window.imageDeletionInProgress = false;

    window.resetDeleteImageControls = function() {
        if (window.deleteImageConfirmationTimer !== null) {
            clearTimeout(window.deleteImageConfirmationTimer);
            window.deleteImageConfirmationTimer = null;
        }

        const button = document.getElementById('delete-image-btn');
        const buttonText = document.getElementById('delete-image-text');
        if (!button || !buttonText) return;

        button.disabled = false;
        button.classList.remove('is-confirming');
        buttonText.textContent = 'delete';
        button.title = 'Delete image';
        button.setAttribute('aria-label', 'Delete image');
    };

    window.removeDeletedImageFromView = function(imageID) {
        const deletedID = String(imageID);
        const imageLink = document.querySelector(
            `#unified-grid .image-card a[data-image-id="${deletedID}"]`
        );
        const imageCard = imageLink ? imageLink.closest('.image-card') : null;

        if (imageCard) {
            if (window.MasonryManager && window.MasonryManager.removeItem) {
                window.MasonryManager.removeItem(imageCard);
            } else {
                imageCard.remove();
            }
        }

        if (typeof window.totalCount === 'number') {
            window.totalCount = Math.max(0, window.totalCount - 1);
            window.updateImageCount();
        }

        window.buildLightboxImageList();
        window.currentLightboxIndex = 0;
        window.closeLightbox();
        document.getElementById('lightbox-img').removeAttribute('src');

        window.modelStatsRequestVersion++;
        window.refreshModelOptions(
            window.currentNSFWFilter || 'all',
            window.modelStatsRequestVersion
        );
    };

    // Upload the currently shown video to Civitai as a draft post, with the
    // metadata we parsed at index time. The server is idempotent: a media
    // that was already uploaded answers with its post URL instead of
    // creating a second post.
    window.sendToCivitai = async function() {
        const currentImageData = window.lightboxMetadata[window.currentLightboxIndex];
        if (!currentImageData?.id) return;

        const button = document.getElementById('civitai-upload-btn');
        const buttonText = document.getElementById('civitai-upload-text');
        const status = document.getElementById('civitai-upload-status');
        const link = document.getElementById('civitai-post-link');

        if (currentImageData.mediaType !== 'video') {
            status.hidden = false;
            status.textContent = 'Only videos can be uploaded to Civitai for now.';
            return;
        }

        button.disabled = true;
        buttonText.textContent = 'uploading...';
        status.hidden = true;
        status.textContent = '';
        link.hidden = true;

        try {
            const response = await fetch(`/api/civitai/upload?id=${encodeURIComponent(currentImageData.id)}`, {
                method: 'POST'
            });
            const data = await response.json();

            if (response.ok && data.ok) {
                if (data.already) {
                    buttonText.textContent = 'on civitai';
                    status.hidden = false;
                    status.textContent = 'Already uploaded — draft is on your Civitai account.';
                } else {
                    buttonText.textContent = 'draft created';
                    status.hidden = false;
                    status.textContent = 'Draft created on Civitai. Review it there, then publish.';
                }
                if (data.post_url) {
                    link.href = data.post_url;
                    link.hidden = false;
                }
            } else {
                throw new Error(data.error || data.message || 'Civitai upload failed');
            }
        } catch (error) {
            console.error('Error uploading to Civitai:', error);
            buttonText.textContent = 'civitai';
            status.hidden = false;
            status.textContent = `Upload failed: ${error.message}`;
            button.disabled = false;
        }
    };

    window.deleteCurrentImage = async function() {
        const currentImageData = window.lightboxMetadata[window.currentLightboxIndex];
        if (!currentImageData?.id || window.imageDeletionInProgress) return;

        const button = document.getElementById('delete-image-btn');
        const buttonText = document.getElementById('delete-image-text');

        if (!button.classList.contains('is-confirming')) {
            button.classList.add('is-confirming');
            buttonText.textContent = 'confirm?';
            button.title = 'Click again to permanently delete this image';
            button.setAttribute('aria-label', 'Confirm permanent image deletion');
            window.deleteImageConfirmationTimer = setTimeout(
                window.resetDeleteImageControls,
                4000
            );
            return;
        }

        if (window.deleteImageConfirmationTimer !== null) {
            clearTimeout(window.deleteImageConfirmationTimer);
            window.deleteImageConfirmationTimer = null;
        }

        const imageID = parseInt(currentImageData.id, 10);
        window.imageDeletionInProgress = true;
        button.disabled = true;
        buttonText.textContent = '...';

        try {
            const response = await fetch(`/api/images/${imageID}`, {
                method: 'DELETE'
            });
            const data = await response.json();
            if (!response.ok || !data.success) {
                throw new Error(data.error || 'Image deletion failed');
            }

            window.imageDeletionInProgress = false;
            window.removeDeletedImageFromView(imageID);
        } catch (error) {
            console.error('Error deleting image:', error);
            window.imageDeletionInProgress = false;
            window.resetDeleteImageControls();
            alert('Failed to delete image: ' + error.message);
        }
    };

    window.toggleImageCategory = function() {
        const currentImageData = window.lightboxMetadata[window.currentLightboxIndex];
        if (!currentImageData || !currentImageData.id) return;

        const button = document.getElementById('category-toggle-btn');
        const buttonText = document.getElementById('category-toggle-text');

        // Disable button during request
        button.disabled = true;
        buttonText.textContent = '...';

        // Make API request to toggle category
        fetch('/api/toggle-category', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                image_id: parseInt(currentImageData.id)
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // Update the current metadata
                const newCategory = data.new_category; // 'sfw' or 'nsfw'

                // Update the button text
                buttonText.textContent = newCategory === 'nsfw' ? 'show' : 'hide';

                // Update the current image's metadata in our array
                currentImageData.is_nsfw = newCategory === 'nsfw';

                // Show success feedback
                button.style.backgroundColor = '#28a745';
                button.style.color = 'white';

                setTimeout(function() {
                    button.style.backgroundColor = '';
                    button.style.color = '';
                }, 1000);

                // If we're currently filtering by category, this image should disappear from the view
                // We'll let the user refresh or navigate away naturally

            } else {
                alert('Failed to move image: ' + (data.error || 'Unknown error'));
                buttonText.textContent = 'hide';
            }
        })
        .catch(error => {
            console.error('Error toggling category:', error);
            alert('Failed to move image. Please try again.');
            buttonText.textContent = 'hide';
        })
        .finally(() => {
            button.disabled = false;
        });
    };

    window.updateArrowVisibility = function() {
        const index = window.currentLightboxIndex;
        document.querySelector('.lightbox-prev').disabled = index <= 0;
        document.querySelector('.lightbox-next').disabled = index >= window.lightboxImages.length - 1;

        // Position within the whole result set; the grid order is the same
        const counter = document.getElementById('lightbox-counter');
        const total = Math.max(window.totalCount || 0, window.lightboxImages.length);
        const meta = window.lightboxMetadata[index];
        let label = `${(index + 1).toLocaleString('en-US')} / ${total.toLocaleString('en-US')}`;
        if (meta && meta.mediaType === 'video') {
            label += meta.duration ? ` · video ${meta.duration}` : ' · video';
        }
        counter.textContent = label;
    };

    // Close lightbox on click outside content
    document.getElementById('lightbox').addEventListener('click', function(e) {
        // Close if clicking on the lightbox backdrop or the content container (but not its children)
        if (e.target === this || e.target.classList.contains('lightbox-content')) {
            closeLightbox();
        }
    });

    // Prevent clicks on image and metadata from closing lightbox
    document.getElementById('lightbox-img').addEventListener('click', function(e) {
        e.stopPropagation();
    });

    document.getElementById('lightbox-video').addEventListener('click', function(e) {
        e.stopPropagation();
    });

    document.querySelector('.lightbox-metadata').addEventListener('click', function(e) {
        e.stopPropagation();
    });

    // Close lightbox with X button
    document.querySelector('.lightbox-close').addEventListener('click', function() {
        closeLightbox();
    });

    // Previous image button
    document.querySelector('.lightbox-prev').addEventListener('click', function() {
        showPrevImage();
    });

    // Next image button
    document.querySelector('.lightbox-next').addEventListener('click', function() {
        showNextImage();
    });

    // Keyboard navigation
    document.addEventListener('keydown', function(e) {
        const lightbox = document.getElementById('lightbox');
        if (lightbox.classList.contains('active')) {
            const promptForm = document.getElementById('prompt-remix-form');
            const promptFormUsesArrowKeys = !promptForm.hidden &&
                (e.key === 'ArrowLeft' || e.key === 'ArrowRight');
            if (promptFormUsesArrowKeys) return;

            switch(e.key) {
                case 'Escape':
                    closeLightbox();
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    showPrevImage();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    showNextImage();
                    break;
            }
        }
    });

    // Grid videos play only while they are on screen. A masonry page holds
    // hundreds of cards; decoding every video at once is what makes it crawl.
    window.VideoPlayback = (function() {
        const PRELOAD_MARGIN = 150;
        let observer = null;
        let suspended = false;

        function start(video) {
            if (suspended) return;
            // The source is attached on first approach, so off-screen videos
            // never cost a network request.
            if (!video.getAttribute('src') && video.dataset.src) {
                video.setAttribute('src', video.dataset.src);
            }
            const playback = video.play();
            if (playback && playback.catch) {
                playback.catch(function() {});
            }
        }

        function ensureObserver() {
            if (observer) return observer;

            observer = new IntersectionObserver(function(entries) {
                entries.forEach(function(entry) {
                    if (entry.isIntersecting) {
                        start(entry.target);
                    } else {
                        entry.target.pause();
                    }
                });
            }, { rootMargin: PRELOAD_MARGIN + 'px 0px', threshold: 0 });

            return observer;
        }

        function observeAll(root) {
            const scope = root || document;
            scope.querySelectorAll('video.grid-video:not([data-playback-observed])')
                .forEach(function(video) {
                    video.setAttribute('data-playback-observed', 'true');
                    ensureObserver().observe(video);
                });
        }

        function release(root) {
            if (!root || !root.querySelectorAll) return;
            root.querySelectorAll('video.grid-video').forEach(function(video) {
                video.pause();
                if (observer) observer.unobserve(video);
            });
        }

        function pauseAll() {
            suspended = true;
            document.querySelectorAll('video.grid-video').forEach(function(video) {
                video.pause();
            });
        }

        // The observer only reports *changes*, and cards start out with no
        // height at all until masonry has laid them out. This asks the layout
        // directly what is on screen, which is what makes the first paint and
        // the return from the lightbox behave.
        function sync() {
            suspended = false;
            document.querySelectorAll('video.grid-video').forEach(function(video) {
                const box = video.getBoundingClientRect();
                const onScreen = box.height > 0 &&
                    box.bottom > -PRELOAD_MARGIN &&
                    box.top < window.innerHeight + PRELOAD_MARGIN;

                if (onScreen) {
                    start(video);
                } else {
                    video.pause();
                }
            });
        }

        return {
            observeAll: observeAll,
            release: release,
            pauseAll: pauseAll,
            sync: sync
        };
    })();

    // Global Masonry Manager for single unified grid with infinite scroll
    window.MasonryManager = (function() {
        let masonryInstance = null;
        let mainGrid = null;
        const GUTTER = 10;
        const MIN_COLUMN_WIDTH = 280;
        // Phones still get two columns rather than one full-width stack
        const MIN_COLUMN_WIDTH_NARROW = 150;
        const NARROW_BREAKPOINT = 640;
        let globalResizeTimeout;
        let resizeObserver;
        let resizeListenerAttached = false;

        // Measure the space the grid has. Right after an HTMX swap the grid can
        // still report zero, and laying out against that gives every card a
        // width of 0px.
        function measureGridWidth(grid) {
            let width = grid.getBoundingClientRect().width;
            if (width === 0 && grid.parentElement) {
                width = grid.parentElement.getBoundingClientRect().width;
            }
            return width;
        }

        // Calculate optimal column width based on container width
        function calculateColumnWidth(containerWidth) {
            const availableWidth = containerWidth;
            const minWidth = availableWidth < NARROW_BREAKPOINT ? MIN_COLUMN_WIDTH_NARROW : MIN_COLUMN_WIDTH;
            const columns = Math.max(1, Math.floor((availableWidth + GUTTER) / (minWidth + GUTTER)));
            const columnWidth = Math.floor((availableWidth - (GUTTER * (columns - 1))) / columns);
            return { columnWidth, columns };
        }

        // Set dynamic column widths for image cards
        function setColumnWidths(grid, columnWidth) {
            const cards = grid.querySelectorAll('.image-card');
            cards.forEach(card => {
                card.style.width = columnWidth + 'px';
            });
        }

        // Initialize masonry for the unified grid (called once on first page load)
        function initializeGrid(grid, attempt) {
            if (!grid) return;

            if (masonryInstance) {
                if (mainGrid === grid) {
                    return;
                }
                destroyInstance();
            }

            // Wait for the browser to give the grid a width before measuring.
            const containerWidth = measureGridWidth(grid);
            if (containerWidth === 0 && (attempt || 0) < 10) {
                requestAnimationFrame(function() {
                    initializeGrid(grid, (attempt || 0) + 1);
                });
                return;
            }

            mainGrid = grid;

            const { columnWidth } = calculateColumnWidth(containerWidth);

            // Set column widths
            setColumnWidths(grid, columnWidth);

            // Wait for images to load
            const images = grid.querySelectorAll('img');
            let loadedCount = 0;
            const totalImages = images.length;

            function createMasonryInstance() {
                // Ensure grid uses full width
                grid.style.width = '100%';

                masonryInstance = new Masonry(grid, {
                    itemSelector: '.image-card',
                    gutter: GUTTER,
                    horizontalOrder: true,
                    containerStyle: { position: 'relative', width: '100%' }
                });

                // Set up resize observer
                setupResizeObserver();

                // Cards only get their real height here, so this is the first
                // moment we can tell which videos are actually on screen.
                if (window.VideoPlayback) {
                    window.VideoPlayback.sync();
                }

                console.log('Masonry instance initialized');

                return masonryInstance;
            }

            if (totalImages === 0) {
                createMasonryInstance();
            } else {
                images.forEach(img => {
                    if (img.complete) {
                        loadedCount++;
                        if (loadedCount === totalImages) {
                            createMasonryInstance();
                        }
                    } else {
                        img.addEventListener('load', () => {
                            loadedCount++;
                            if (loadedCount === totalImages) {
                                createMasonryInstance();
                            }
                        });
                    }
                });
            }
        }

        // Append new items to existing masonry instance (called when loading more pages)
        function appendItems() {
            if (!masonryInstance || !mainGrid) {
                console.warn('Cannot append items: Masonry instance not initialized');
                return;
            }

            // Get newly added image cards (those without width set)
            const allCards = mainGrid.querySelectorAll('.image-card');
            const newCards = Array.from(allCards).filter(card => !card.style.width);

            if (newCards.length === 0) {
                console.log('No new items to append');
                return;
            }

            console.log('Appending', newCards.length, 'new items to Masonry');

            const { columnWidth } = calculateColumnWidth(measureGridWidth(mainGrid));

            // Set width for new cards
            newCards.forEach(card => {
                card.style.width = columnWidth + 'px';
            });

            // Wait for new images to load before appending
            const newImages = mainGrid.querySelectorAll('.image-card:not([data-loaded]) img');
            let loadedCount = 0;
            const totalImages = newImages.length;

            function appendToMasonry() {
                // Mark all current cards as loaded
                allCards.forEach(card => card.setAttribute('data-loaded', 'true'));

                // Append new elements to Masonry
                masonryInstance.appended(newCards);

                // Force layout update
                masonryInstance.layout();

                if (window.VideoPlayback) {
                    window.VideoPlayback.sync();
                }

                console.log('New items appended and layout updated');
            }

            if (totalImages === 0) {
                appendToMasonry();
            } else {
                newImages.forEach(img => {
                    if (img.complete) {
                        loadedCount++;
                        if (loadedCount === totalImages) {
                            appendToMasonry();
                        }
                    } else {
                        img.addEventListener('load', () => {
                            loadedCount++;
                            if (loadedCount === totalImages) {
                                appendToMasonry();
                            }
                        });
                    }
                });
            }
        }

        function removeItem(item) {
            if (!item) return;

            if (window.VideoPlayback) {
                window.VideoPlayback.release(item);
            }

            if (masonryInstance && mainGrid && mainGrid.contains(item)) {
                masonryInstance.remove(item);
                masonryInstance.layout();
                return;
            }

            item.remove();
        }

        // Handle resize with debouncing
        function handleResize() {
            clearTimeout(globalResizeTimeout);
            globalResizeTimeout = setTimeout(() => {
                if (masonryInstance && mainGrid && document.contains(mainGrid)) {
                    const { columnWidth } = calculateColumnWidth(measureGridWidth(mainGrid));

                    // Update column widths for all cards
                    setColumnWidths(mainGrid, columnWidth);

                    // Relayout masonry
                    masonryInstance.layout();

                    if (window.VideoPlayback) {
                        window.VideoPlayback.sync();
                    }

                    console.log('Masonry layout updated after resize');
                }
            }, 250);
        }

        // Set up ResizeObserver for better performance
        function setupResizeObserver() {
            if (window.ResizeObserver) {
                if (!resizeObserver) {
                    resizeObserver = new ResizeObserver(handleResize);
                    resizeObserver.observe(document.body);
                }
            } else if (!resizeListenerAttached) {
                window.addEventListener('resize', handleResize);
                resizeListenerAttached = true;
            }
        }

        function destroyInstance() {
            if (resizeObserver) {
                resizeObserver.disconnect();
                resizeObserver = null;
            } else if (resizeListenerAttached) {
                window.removeEventListener('resize', handleResize);
                resizeListenerAttached = false;
            }

            if (masonryInstance) {
                masonryInstance.destroy();
                masonryInstance = null;
            }

            mainGrid = null;
        }

        // Public API
        return {
            initializeGrid: initializeGrid,
            appendItems: appendItems,
            removeItem: removeItem,
            handleResize: handleResize,
            destroyInstance: destroyInstance
        };
    })();
    </script>
</body>
</html>
